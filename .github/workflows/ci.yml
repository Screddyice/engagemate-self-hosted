name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGCLIENTENCODING: UTF8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-test.txt
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Install backend dependencies
        run: python -m pip install -r api/requirements-test.txt
      - name: Run backend tests
        run: python -m pytest -q

  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGCLIENTENCODING: UTF8
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install PostgreSQL client
        working-directory: .
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Create build database
        working-directory: .
        run: createdb engagemate_ci
      - name: Install web dependencies
        run: npm ci
      - name: Run web tests
        run: npm test -- --run
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/engagemate_ci
      - name: Build production web app
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/engagemate_ci
          NEXT_PUBLIC_APP_URL: http://localhost:3030
      - name: Run standalone TypeScript check
        run: npx tsc --noEmit
