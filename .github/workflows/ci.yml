name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Crow CI on Shawn's Mac runs the same checks (.woodpecker.yaml) and posts a
  # ci/crow/... status within seconds of receiving a push. This job waits up to
  # 3 minutes for one: found, the jobs below are skipped and Crow's result is the
  # merge check; none (Mac asleep or offline, webhook lost), they run here as the
  # standard GitHub CI. A manual run (workflow_dispatch) always runs them.
  crow-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "Manual run: running GitHub CI."; echo run=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          for _ in $(seq 1 12); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/statuses" \
              --jq '[.[] | select(.context | startswith("ci/crow/"))] | length' || echo 0)
            if [ "${n:-0}" -gt 0 ]; then
              echo "Crow picked up $SHA; skipping GitHub CI (Crow's status is the check)."
              echo run=false >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 15
          done
          echo "No Crow status on $SHA after 3 minutes (Mac asleep or offline); running GitHub CI."
          echo run=true >> "$GITHUB_OUTPUT"

  backend:
    name: Backend tests
    needs: crow-gate
    if: needs.crow-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGCLIENTENCODING: UTF8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-test.txt
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Install backend dependencies
        run: python -m pip install -r api/requirements-test.txt
      - name: Run backend tests
        run: python -m pytest -q

  web:
    name: Web tests and build
    needs: crow-gate
    if: needs.crow-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGCLIENTENCODING: UTF8
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install PostgreSQL client
        working-directory: .
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Create build database
        working-directory: .
        run: createdb engagemate_ci
      - name: Install web dependencies
        run: npm ci
      - name: Run web tests
        run: npm test -- --run
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/engagemate_ci
      - name: Build production web app
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/engagemate_ci
          NEXT_PUBLIC_APP_URL: http://localhost:3030
      - name: Run standalone TypeScript check
        run: npx tsc --noEmit
