# Crow CI (Woodpecker-compatible) on Shawn's Mac, linux/arm64 agent.
# Mirrors the "Backend tests" and "Web tests and build" jobs in .github/workflows/ci.yml.
# The postgres service is a disposable database with a throwaway password ("ci"); no real data.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ci

# Some tests connect to localhost:5432 explicitly (GitHub maps the service port to
# localhost), so each step forwards its loopback port 5432 to the service with socat.
steps:
  backend:
    image: python:3.12-bookworm
    depends_on: []
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci
      PGCLIENTENCODING: UTF8
    commands:
      - apt-get update -qq && apt-get install --yes -qq postgresql-client socat >/dev/null
      # The extension runtime tests shell out to node, and the compose contract tests run
      # `docker compose config` (no daemon needed). GitHub's runner has both preinstalled.
      - curl -fsSL "https://nodejs.org/dist/v22.23.5/node-v22.23.5-linux-$(uname -m | sed 's/x86_64/x64/;s/aarch64/arm64/').tar.xz" | tar -xJ -C /usr/local --strip-components=1
      - install -m 0755 -d /etc/apt/keyrings && curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
      - echo "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bookworm stable" > /etc/apt/sources.list.d/docker.list
      - apt-get update -qq && apt-get install --yes -qq docker-ce-cli docker-compose-plugin >/dev/null
      - node --version && docker compose version
      - for i in $(seq 1 60); do pg_isready -h postgres -U postgres && break; sleep 1; done
      - pg_isready -h postgres -U postgres
      - socat TCP-LISTEN:5432,bind=127.0.0.1,fork,reuseaddr TCP:postgres:5432 &
      - python -m pip install -q -r api/requirements-test.txt
      - python -m pytest -q

  web:
    image: node:22-bookworm
    depends_on: []
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci
      PGCLIENTENCODING: UTF8
      DATABASE_URL: postgresql://postgres:ci@postgres:5432/engagemate_ci
      NEXT_PUBLIC_APP_URL: http://localhost:3030
    commands:
      - apt-get update -qq && apt-get install --yes -qq postgresql-client socat >/dev/null
      - for i in $(seq 1 60); do pg_isready -h postgres -U postgres && break; sleep 1; done
      - createdb engagemate_ci
      - socat TCP-LISTEN:5432,bind=127.0.0.1,fork,reuseaddr TCP:postgres:5432 &
      - cd app
      - npm ci
      - npm test -- --run
      - npm run build
      - npx tsc --noEmit

when:
  event: [push, pull_request, manual]
